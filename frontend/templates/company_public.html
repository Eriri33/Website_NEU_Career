<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thông tin doanh nghiệp | NEU Career</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="public-company" id="companyPage"><p class="loading">Đang tải thông tin doanh nghiệp…</p></main>
  <script>
    const page = document.getElementById('companyPage');
    const escapeHtml = (value = '') => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    fetch('/api/company/public/{{ company_id }}').then(async response => {
      const data = await response.json(); if (!response.ok) throw Error(data.message || 'Không tìm thấy doanh nghiệp.'); return data;
    }).then(company => {
      const map = company.address ? `https://www.google.com/maps?q=${encodeURIComponent(company.address)}&output=embed` : '';
      page.innerHTML = `<a class="text-link" href="/">← Quay lại tìm việc</a><section class="company-public-hero"><p class="eyebrow blue">DOANH NGHIỆP ĐỐI TÁC</p><h1>${escapeHtml(company.company_name)}</h1><p>${escapeHtml(company.description) || 'Doanh nghiệp đang cập nhật giới thiệu.'}</p>${company.website ? `<a class="btn btn-primary" href="${escapeHtml(company.website)}" target="_blank" rel="noopener">Truy cập website</a>` : ''}</section><div class="company-public-grid"><section class="company-public-card"><h2>Thông tin chung</h2><dl><dt>Quy mô</dt><dd>${escapeHtml(company.company_size) || 'Đang cập nhật'}</dd><dt>Lĩnh vực kinh doanh</dt><dd>${escapeHtml(company.business_industries) || 'Đang cập nhật'}</dd><dt>Ngành nghề chính</dt><dd>${escapeHtml(company.primary_industry) || 'Đang cập nhật'}</dd></dl></section><section class="company-public-card"><h2>Địa điểm công ty</h2><p>${escapeHtml(company.address) || 'Đang cập nhật'}</p>${map ? `<iframe title="Bản đồ địa điểm công ty" src="${map}" loading="lazy"></iframe><a class="text-link" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(company.address)}">Mở trong Google Maps ↗</a>` : ''}</section></div>`;
    }).catch(error => { page.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`; });
  </script>
</body></html>
